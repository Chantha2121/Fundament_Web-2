<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
    crossorigin="anonymous"></script>
</head>

<body>
  <main class="container py-4">
    <h1 class="mb-4">JQuery Form to Table</h1>
    <form id="student-form" class="row g-3">
      <div class="col-md-6">
        <label for="full-name" class="form-lable">Full Name</label>
        <input type="text" id="full-name" name="fullName" class="form-control" placeholder="Enter the Name" required>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-lable">Email</label>
        <input type="text" id="email" name="email" class="form-control" placeholder="Enter the Email" required>
      </div>
      <div class="col-md-6">
        <label for="course" class="form-lable">Courses</label>
        <select name="course" class="form-select" id="course" required>
          <option value="">Select the course</option>
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="Javascript">Javascript</option>
          <option value="JQuery">JQuery</option>
        </select>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Add to Table</button>
      </div>
    </form>

    <div id="empty-state">No data yet. Submit the form to add table row.</div>
    <div class="table-responsive mt-3">
      <table id="data-table" aria-live="polite" class="table table-striped align-middle">
        <thead class="table-light">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Full Name</th>
            <th scope="col">Email</th>
            <th scope="col">Course</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</body>

<script>
  $(function () {
    var rowCount = 0;

    function toggleEmptyState() {
      var hasRow = $('#data-table tbody tr').length > 0;
      $('#empty-state').toggle(!hasRow);
    }

    $("#student-form").on('submit', function (event) {
      event.preventDefault();

      var full_name = $('#full-name').val();
      var email = $('#email').val();
      var course = $('#course').val();

      if (!full_name || !email || !course) {
        return;
      }

      rowCount += 1;
      var rowHtml = "" +
        "<tr>" +
        "<td>" + rowCount + "</td>" +
        "<td>" + full_name + "</td>" +
        "<td>" + email + "</td>" +
        "<td>" + course + "</td>" +
        "<tr>";

      $('#data-table tbody').append(rowHtml);
      this.reset();
      toggleEmptyState();
    })
    toggleEmptyState();
  })
</script>

</html>
