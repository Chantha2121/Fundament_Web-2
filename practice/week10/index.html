<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
    crossorigin="anonymous"></script>
</head>

<body>
  <div id="demo" style="color: red;"></div>
  <button id="btn_getstudent">Get Student</button>

</body>
<script>
  $(document).ready(function () {
    $('#btn_getstudent').click(function () {
      $.ajax({
        url: "http://localhost:3000/students",
        type: "GET",
        success: function (result) {
          // let data = JSON.stringify(result)
          for (let student of result) {
            $('#demo').append(`<img src="${student.image}" width="150" alt="${student.name}">`);
          }

          // $('#demo').html(JSON.stringify(result));
        }
      })
    })
  })
</script>

</html>
