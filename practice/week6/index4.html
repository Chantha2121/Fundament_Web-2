<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      direction: rtl;
      /* justify-content: center;
      align-items: center; */
    }

    .box {
      display: flex;
      padding-top: 10px;
      /* justify-content: space-between; */
      flex-wrap: wrap;

      padding-bottom: 10px;
      width: 500px;
      height: 50px;
      background-color: rgb(23, 134, 238);
    }

    [class|='num'] {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin-left: 10px;
      font-size: 24px;
      background-color: white;
      width: 40px;
      height: 50px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="num-1">1</div>
    <div class="num-2">2</div>
    <div class="num-3">3</div>
  </div>
</body>

</html>
